  /companies/{company_id}/company-affiliates/:
    get:
      operationId: companies_company_affiliates_retrieve
      description: 'Returns broker-dealer, advisor, and advisor firm data for the given company.


        Notes:

        - Some or all returned fields may be null.

        - Advisor and firm CRD numbers may not always be available.

        - If the company is working with a specific advisor from a firm, that advisor will be included
        in the response.

        - If the company works with a firm but not a specific advisor, the advisor field will be null.'
      parameters:
      - in: path
        name: company_id
        schema:
          type: string
        required: true
      tags:
      - Affiliates & Firms
      security:
      - oauth2: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  broker_dealer:
                    allOf:
                    - type: object
                      properties:
                        name:
                          type: string
                          maxLength: 75
                        address:
                          type: object
                          description: A participant's Address
                          properties:
                            address_line_1:
                              type: string
                              maxLength: 100
                            address_line_2:
                              type: string
                              maxLength: 100
                            city:
                              type: string
                              maxLength: 80
                            state:
                              type: string
                              maxLength: 80
                            postal_code:
                              type: string
                              maxLength: 20
                            country:
                              type: string
                              default: US
                              maxLength: 80
                          required:
                          - address_line_1
                          - city
                          - postal_code
                          - state
                        contact_name:
                          type: string
                          maxLength: 75
                      required:
                      - address
                  advisor:
                    allOf:
                    - type: object
                      properties:
                        object_id:
                          type: string
                          readOnly: true
                        crd:
                          type: string
                        address:
                          type: object
                          description: A participant's Address
                          properties:
                            address_line_1:
                              type: string
                              maxLength: 100
                            address_line_2:
                              type: string
                              maxLength: 100
                            city:
                              type: string
                              maxLength: 80
                            state:
                              type: string
                              maxLength: 80
                            postal_code:
                              type: string
                              maxLength: 20
                            country:
                              type: string
                              default: US
                              maxLength: 80
                          required:
                          - address_line_1
                          - city
                          - postal_code
                          - state
                        name:
                          type: string
                          maxLength: 100
                      required:
                      - address
                      - crd
                      - name
                      - object_id
                  advisor_firm:
                    allOf:
                    - type: object
                      properties:
                        object_id:
                          type: string
                          readOnly: true
                        crd:
                          type: string
                          readOnly: true
                        address:
                          type: object
                          description: A participant's Address
                          properties:
                            address_line_1:
                              type: string
                              maxLength: 100
                            address_line_2:
                              type: string
                              maxLength: 100
                            city:
                              type: string
                              maxLength: 80
                            state:
                              type: string
                              maxLength: 80
                            postal_code:
                              type: string
                              maxLength: 20
                            country:
                              type: string
                              default: US
                              maxLength: 80
                          required:
                          - address_line_1
                          - city
                          - postal_code
                          - state
                        name:
                          type: string
                          maxLength: 100
                        contact_name:
                          type: string
                          maxLength: 75
                        contact_email:
                          type: string
                          format: email
                          maxLength: 254
                        is_338_firm:
                          type: boolean
                          readOnly: true
                      required:
                      - address
                      - crd
                      - is_338_firm
                      - name
                      - object_id
                required:
                - advisor
                - advisor_firm
                - broker_dealer
          description: ''
        '401':
          description: 'Unauthorized: Missing or invalid authentication'
        '403':
          description: 'Forbidden: Insufficient permissions or scopes'
components:
  securitySchemes:
    knoxApiToken:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
    oauth2:
      type: http
      scheme: bearer
      description: OAuth 2.0 Bearer based with an existing token. Enter a token retrieved via the regular
        OAuth flow elsewhere.
servers:
- url: https://app.401go.com/api
  description: Base URL reconciled from apis.yml
