openapi: 3.2.0
info:
  title: 401GO Beneficiaries API
  version: 1.0.0
tags:
- name: Beneficiaries
paths:
  /participants/{participant_id}/beneficiaries/:
    get:
      operationId: participants_beneficiaries_list
      description: Get a list of a participant's beneficiaries.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: participant_id
        schema:
          type: string
        required: true
      tags:
      - Beneficiaries
      security:
      - oauth2: []
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - count
                - results
                properties:
                  count:
                    type: integer
                    example: 123
                  next:
                    type:
                    - string
                    - 'null'
                    format: uri
                    example: http://api.example.org/accounts/?page=4
                  previous:
                    type:
                    - string
                    - 'null'
                    format: uri
                    example: http://api.example.org/accounts/?page=2
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        object_id:
                          type:
                          - string
                          - 'null'
                        name:
                          type: string
                          maxLength: 200
                        email:
                          type: string
                          format: email
                          maxLength: 100
                        phone:
                          type: string
                          maxLength: 40
                        dob:
                          type: string
                          format: date
                          title: Birthday
                        percentage:
                          type: string
                          format: decimal
                          pattern: ^-?\d{0,3}(?:\.\d{0,0})?$
                          description: Enter a percentage, so 1% would be 1.0 and 5 bps would be 0.05
                      required:
                      - dob
                      - name
                      - percentage
          description: ''
        '401':
          description: 'Unauthorized: Missing or invalid authentication'
        '403':
          description: 'Forbidden: Insufficient permissions or scopes'
    post:
      operationId: participants_beneficiaries_create
      description: 'Create a single or multiple beneficiaries for a participant.

        If a list is provided, either all or none will be created.'
      parameters:
      - in: header
        name: Idempotent-Key
        schema:
          type: string
        description: Supply a key to safely retry requests without the server duplicating the action.
          Will be remembered for 24 hours.
      - in: path
        name: participant_id
        schema:
          type: string
        required: true
      tags:
      - Beneficiaries
