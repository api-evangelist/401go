                    minLength: 1
                    maxLength: 200
                  email:
                    type: string
                    format: email
                    maxLength: 100
                  phone:
                    type: string
                    maxLength: 40
                  dob:
                    type: string
                    format: date
                    title: Birthday
                  percentage:
                    type: string
                    format: decimal
                    pattern: ^-?\d{0,3}(?:\.\d{0,0})?$
                    description: Enter a percentage, so 1% would be 1.0 and 5 bps would be 0.05
                required:
