                      - 'null'
                    name:
                      type: string
                      minLength: 1
                      maxLength: 200
                    email:
                      type: string
                      format: email
                      maxLength: 100
                    phone:
                      type: string
                      maxLength: 40
                    dob:
                      type: string
                      format: date
