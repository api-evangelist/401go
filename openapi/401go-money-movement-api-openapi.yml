                  - Purchase of a Principal Residence
                  - Educational Fees
                  - Prevent Eviction or Foreclosure
                  - Funeral Expenses
                  - Repair Damage to Principal Residence
                  - Qualified Federally Declared Disasters
                  description: Specific hardship reason (required for hardship disbursements).
                name:
                  type: string
                  minLength: 1
                  description: The participant's name
                dob:
                  type: string
                  format: date
                  description: The participant's date of birth
                married:
                  type: boolean
                  description: The participant's marital status
                phone:
                  type: string
                  minLength: 1
                  description: The participant's phone number
                address:
                  allOf:
                  - type: object
                    description: A participant's Address
                    properties:
                      address_line_1:
                        type: string
                        minLength: 1
                        maxLength: 100
                      address_line_2:
                        type: string
                        maxLength: 100
                      city:
                        type: string
                        minLength: 1
                        maxLength: 80
                      state:
                        type: string
                        minLength: 1
                        maxLength: 80
                      postal_code:
                        type: string
                        minLength: 1
                        maxLength: 20
                      country:
                        type: string
                        minLength: 1
                        default: US
                        maxLength: 80
                    required:
                    - address_line_1
                    - city
                    - postal_code
                    - state
                  description: The participant's address
              required:
              - address
              - dob
              - married
              - name
              - payment_method
              - phone
              - reason
