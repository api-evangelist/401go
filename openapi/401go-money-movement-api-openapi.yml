                payment_address:
                  allOf:
                  - type: object
                    description: A participant's Address
                    properties:
                      address_line_1:
                        type: string
                        minLength: 1
                        maxLength: 100
                      address_line_2:
                        type: string
                        maxLength: 100
                      city:
                        type: string
                        minLength: 1
                        maxLength: 80
                      state:
                        type: string
                        minLength: 1
                        maxLength: 80
                      postal_code:
                        type: string
                        minLength: 1
                        maxLength: 20
                      country:
                        type: string
                        minLength: 1
                        default: US
                        maxLength: 80
                    required:
                    - address_line_1
                    - city
                    - postal_code
                    - state
                  description: Payment address for pre-tax portion (defaults to participant's address
                    if not provided). Only required if different from participant's address.
                posttax_payment_address:
                  allOf:
                  - type: object
                    description: A participant's Address
                    properties:
                      address_line_1:
                        type: string
                        minLength: 1
                        maxLength: 100
                      address_line_2:
                        type: string
                        maxLength: 100
                      city:
                        type: string
                        minLength: 1
                        maxLength: 80
                      state:
                        type: string
                        minLength: 1
                        maxLength: 80
                      postal_code:
                        type: string
                        minLength: 1
                        maxLength: 20
                      country:
                        type: string
                        minLength: 1
                        default: US
                        maxLength: 80
                    required:
                    - address_line_1
                    - city
                    - postal_code
                    - state
                  description: Payment address for post-tax portion (defaults to participant's address
                    if not provided).
                bank_name:
                  type: string
                  description: Name of the bank for ACH/Wire payments (used for pre-tax portion in splits).
                    For single disbursements, use this field regardless of tax type. For split disbursements,
                    this applies to the pre-tax portion
                bank_routing_aba_number:
                  type: string
                  description: Routing (ABA) number for the bank account. For single disbursements, use
