  /participants/{participant_id}/money-movement-history/:
    get:
      operationId: participants_money_movement_history_list
      description: 'Get a list of money movement transactions for the given participant id.


        The account type will be Pre-tax for employee pre-tax movements, Post-tax for employee post-tax
        movements,

        Vested Contribution for any vested employer contributions, Non-vested Contribution for any non-vested
        employer contributions.

        The tax_type field is only really useful to distinguish pre-tax or post-tax employer contributions
        when it has a value.'
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: participant_id
        schema:
          type: string
        required: true
      tags:
      - Money Movement
      security:
      - oauth2: []
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - count
                - results
                properties:
                  count:
                    type: integer
                    example: 123
                  next:
                    type:
                    - string
                    - 'null'
                    format: uri
                    example: http://api.example.org/accounts/?page=4
                  previous:
                    type:
                    - string
                    - 'null'
                    format: uri
                    example: http://api.example.org/accounts/?page=2
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        object_id:
                          type: string
                        memo:
                          type: string
                          maxLength: 200
                        amount:
                          type: string
                          format: decimal
                          pattern: ^-?\d{0,12}(?:\.\d{0,8})?$
                        movement_type:
                          enum:
                          - Employee Deferral
                          - Non-roth After Tax Deferral
                          - Rollover
                          - Dividend
                          - Discretionary Non Elective (Profit Sharing)
                          - Safe Harbor Non Elective
                          - Discretionary Match
                          - Safe Harbor Match
                          - Correction Contribution (QMAC)
                          - Qualified Non-Elective Contribution
                          - Loan Interest
                          - Disbursement
                          - Correction Disbursement
                          - Lost Earnings Contribution
                          - Transferred Earnings
                          - Loan
                          - Fee
                          - Other
                          type: string
                          description: '* `Employee Deferral` - Employee Deferral

                            * `Non-roth After Tax Deferral` - Non-roth After Tax Deferral

                            * `Rollover` - Rollover

                            * `Dividend` - Dividend

                            * `Discretionary Non Elective (Profit Sharing)` - Discretionary Non Elective
                            (Profit Sharing)

                            * `Safe Harbor Non Elective` - Safe Harbor Non Elective

                            * `Discretionary Match` - Discretionary Match

                            * `Safe Harbor Match` - Safe Harbor Match

                            * `Correction Contribution (QMAC)` - Correction Contribution (QMAC)

                            * `Qualified Non-Elective Contribution` - Qualified Non-Elective Contribution

                            * `Loan Interest` - Loan Interest

                            * `Disbursement` - Disbursement

                            * `Correction Disbursement` - Correction Disbursement

                            * `Lost Earnings Contribution` - Lost Earnings Contribution

                            * `Transferred Earnings` - Transferred Earnings

                            * `Loan` - Loan

                            * `Fee` - Fee

                            * `Other` - Other'
                          x-spec-enum-id: c7efb0d4aff775fd
                        applied_date:
                          type:
                          - string
                          - 'null'
                          format: date
                        account_type:
                          enum:
                          - Pre-tax
                          - Post-tax
                          - Vested Contribution
                          - Non-vested Contribution
                          type: string
                          description: '* `Pre-tax` - Pre-tax

                            * `Post-tax` - Post-tax

                            * `Vested Contribution` - Vested Contribution

                            * `Non-vested Contribution` - Non-vested Contribution'
                          x-spec-enum-id: 5548afd0b1c14da0
                        tax_type:
                          enum:
                          - Pre-tax
                          - Post-tax
                          type: string
                          description: '* `Pre-tax` - Pre-tax

                            * `Post-tax` - Post-tax'
                          x-spec-enum-id: 40e39026ee7fdc9a
                        testing_exempt:
                          type: boolean
                      required:
                      - account_type
                      - movement_type
                      - object_id
          description: ''
        '401':
          description: 'Unauthorized: Missing or invalid authentication'
        '403':
          description: 'Forbidden: Insufficient permissions or scopes'
