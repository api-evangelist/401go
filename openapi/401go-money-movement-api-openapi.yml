              - prior_tpa_contact_phone
              - total_rollover_amount
        required: true
      security:
      - oauth2: []
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                description: A rollover request for a participant that accepts all information in a single
                  request.
                properties:
                  object_id:
                    type: string
                    readOnly: true
                  name:
                    type: string
                    description: The participant's name
                  address:
                    allOf:
                    - type: object
                      description: A participant's Address
                      properties:
                        address_line_1:
                          type: string
                          maxLength: 100
                        address_line_2:
                          type: string
                          maxLength: 100
                        city:
                          type: string
                          maxLength: 80
                        state:
                          type: string
                          maxLength: 80
                        postal_code:
                          type: string
                          maxLength: 20
                        country:
                          type: string
                          default: US
                          maxLength: 80
                      required:
                      - address_line_1
                      - city
                      - postal_code
                      - state
                    description: The participant's address
                  phone:
                    type: string
                    description: The participant's phone number
                  dob:
                    type: string
                    description: The participant's date of birth
                  married:
                    type: boolean
                    description: The participant's marital status
                  prior_plan_name:
                    type: string
                    maxLength: 250
                  prior_tpa_contact_name:
                    type: string
                    maxLength: 250
                  prior_tpa_contact_phone:
                    type: string
                    maxLength: 40
                  prior_tpa_contact_email:
                    type: string
                    format: email
                    maxLength: 254
                  prior_plan_type:
                    type: string
                    enum:
                    - Traditional (pre-tax) 401(k)
                    - Roth (post-tax) 401(k)
                    - Mixed Traditional/Roth 401(k)
                    - Traditional (pre-tax) IRA
                    - Roth (post-tax) IRA
                    - Mixed Traditional/Roth IRA
                    - Simple IRA
                    - SEP IRA
                    - Conduit IRA
                    - 403(a)
                    - 403(b)
                    - Profit Sharing Plan
                    - Defined Benefit Plan
                    - Money Purchase Plan
                    - Governmental 457
                    - Roth (post-tax) Governmental 457
                    - Pre-tax Qualified Retirement Plan
                    - Post-tax Qualified Retirement Plan
                  total_rollover_amount:
                    type: string
                    format: decimal
                    pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
                  roth_contribution_basis:
                    type: string
                    format: decimal
                    pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
                    default: '0.00'
                  roth_contribution_first_year:
                    type: integer
                    minimum: 0
                    default: 0
                  is_minimum_required_distribution:
                    type: boolean
                    default: false
                  is_hardship_withdrawal:
                    type: boolean
                    default: false
                  is_indirect_rollover:
                    type: boolean
                    default: false
                  status:
                    type: string
                    enum:
                    - Incomplete
                    - Submitted
                    - Funds Received
                    - Abandoned
                    readOnly: true
                  rollover_acceptance_letter_url:
                    type: string
                    readOnly: true
                required:
                - address
                - dob
                - married
                - name
                - object_id
                - phone
                - prior_plan_name
                - prior_plan_type
                - prior_tpa_contact_email
                - prior_tpa_contact_name
                - prior_tpa_contact_phone
                - rollover_acceptance_letter_url
                - status
                - total_rollover_amount
          description: ''
        '400':
          description: 'Bad Request: Invalid rollover data'
        '401':
          description: 'Unauthorized: Missing or invalid authentication'
        '403':
          description: 'Forbidden: Insufficient permissions or scopes'
    delete:
      operationId: participants_rollovers_destroy
      description: Delete a rollover request.
      parameters:
      - in: path
        name: participant_id
        schema:
          type: string
        required: true
      - in: path
        name: rollover_id
        schema:
          type: string
        required: true
      tags:
      - Money Movement
      security:
      - oauth2: []
      - knoxApiToken: []
      responses:
        '204':
          description: No response body
        '400':
          description: 'Bad Request: Cannot delete rollover'
        '401':
          description: 'Unauthorized: Missing or invalid authentication'
        '403':
          description: 'Forbidden: Insufficient permissions or scopes'
components:
  securitySchemes:
    knoxApiToken:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
    oauth2:
      type: http
      scheme: bearer
      description: OAuth 2.0 Bearer based with an existing token. Enter a token retrieved via the regular
        OAuth flow elsewhere.
servers:
- url: https://app.401go.com/api
  description: Base URL reconciled from apis.yml
