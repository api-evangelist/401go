                  is_rollover:
                    type: boolean
                    default: false
                    description: Set to true if this is a rollover to a new provider.
                  payment_address:
                    allOf:
                    - type: object
                      description: A participant's Address
                      properties:
                        address_line_1:
                          type: string
                          maxLength: 100
                        address_line_2:
                          type: string
                          maxLength: 100
