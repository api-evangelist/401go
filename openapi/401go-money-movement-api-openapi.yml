  /participants/{participant_id}/disbursements-info/:
    get:
      operationId: participants_disbursements_info_retrieve
      description: 'Get information about available disbursement options before creating one.


        Query parameters can be used to get accurate available amounts for different disbursement types:

        - is_hardship: Calculate amounts for hardship disbursements

        - is_emergency: Calculate amounts for emergency expense disbursements

        - is_move_rollover: Calculate amounts for move rollover disbursements


        All parameters default to false if not specified.'
      parameters:
      - in: query
        name: is_emergency
        schema:
          type: boolean
          default: false
        description: Whether to calculate available amounts for emergency expense disbursements.
      - in: query
        name: is_hardship
        schema:
          type: boolean
          default: false
        description: Whether to calculate available amounts for hardship disbursements.
      - in: query
        name: is_move_rollover
        schema:
          type: boolean
          default: false
        description: Whether to calculate available amounts for move rollover disbursements.
      - in: path
        name: participant_id
        schema:
          type: string
        required: true
      tags:
      - Money Movement
      security:
      - oauth2: []
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                description: Provides information about available disbursement options before creating
                  a disbursement.
                properties:
                  available_reasons:
                    type: array
                    items:
                      type: string
                    description: List of available disbursement reasons for this participant.
                  missing_reasons:
                    type: object
                    additionalProperties: {}
                    description: Dictionary of unavailable reasons with explanations why.
                  pretax_available:
                    type: string
                    format: decimal
                    pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
                    description: Available pre-tax balance for disbursement.
                  posttax_available:
                    type: string
                    format: decimal
                    pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
                    description: Available post-tax balance for disbursement.
                  minimum_disbursement:
                    type: string
                    format: decimal
                    pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
                    description: Minimum allowed disbursement amount.
                required:
                - available_reasons
                - minimum_disbursement
                - missing_reasons
                - posttax_available
                - pretax_available
          description: ''
        '400':
          description: 'Bad Request: Unable to get participant info or invalid query parameters'
        '401':
          description: 'Unauthorized: Missing or invalid authentication'
        '403':
          description: 'Forbidden: Insufficient permissions or scopes'
