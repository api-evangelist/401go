  /participants/{participant_id}/participant-setup/:
    get:
      operationId: participants_participant_setup_retrieve
      description: 'Gets plan data for the associated participant, and if they''ve set their deferral
        elections.


        Choices for ''plan_type'' are ''Volume Submitter Prototype Format'' (401k plans), ''403B'', and
        ''Starter-K'''
      parameters:
      - in: path
        name: participant_id
        schema:
          type: string
        required: true
      tags:
      - Participants
      security:
      - oauth2: []
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                description: Serializer for participant setup information including plan details and deferral
                  status.
                properties:
                  eligibility_date:
                    type: string
                    format: date
                  has_deferrals:
                    type: boolean
                  plan_name:
                    type: string
                  plan_type:
                    type: string
                  plan_number:
                    type: integer
                  plan_allow_self_direct:
                    type: boolean
                  opted_to_self_direct:
                    type: boolean
                  auto_enroll_percent:
                    type:
                    - string
                    - 'null'
                    default: '5'
                    maxLength: 2
                  has_eDocs_agreement:
                    type: boolean
                required:
                - eligibility_date
                - has_deferrals
                - has_eDocs_agreement
                - opted_to_self_direct
                - plan_allow_self_direct
                - plan_name
                - plan_number
                - plan_type
          description: ''
        '400':
          description: 'Bad Request: No active plan associated with this account'
        '401':
          description: 'Unauthorized: Missing or invalid authentication'
        '403':
          description: 'Forbidden: Insufficient permissions or scopes'
