                    description: How often the company runs payroll. If providing this field you must
                      also provide next_payroll_date.
                  next_payroll_date:
                    type: string
                    format: date
                    description: Date of the company's next scheduled payroll. Must be in the future and
                      within 365 days. Must be on or after plan_effective_date if provided. If providing
                      this field you must also provide payroll_frequency.
                  number_of_employees:
                    type: integer
                    description: Approximate number of current employees. Used to determine SECURE 2.0
                      automatic enrollment exemptions.
                  grandfather_existing_employees:
                    type: boolean
                    description: Whether employees already employed on the plan effective date should
                      be grandfathered in as immediately eligible. Requires plan_effective_date to also
                      be provided.
                  employee_notification_date:
                    type: string
                    format: date
                    description: Date on which employees will be notified of the plan. Must be in the
                      future and at least 2 days before plan_effective_date.
                  business_start_date:
                    type: string
                    format: date
                    description: Date the company was founded. Used to determine whether the company qualifies
                      for SECURE 2.0 automatic enrollment exemptions (businesses founded within the past
                      3 years).
                  acting_338:
                    type:
                    - string
                    - 'null'
                    description: ID of the 3(38) investment advisor to associate with this plan. Retrieve
                      this ID from the  affiliate-firms/<affiliate_firm_id>/affiliates/ endpoint. An affiliate
                      firm ID may also be provided to assign that affiliate firm as the 3(38). Mutually
                      exclusive with pooled_plan. Provide one or the other.
                  billing_tier:
                    type:
                    - string
                    - 'null'
                    description: ID of the pricing tier to apply to this plan. Retrieve this ID from the
                      affiliate-firms/<affiliate_firm_id>/pricing-tiers/ or affiliates/<affiliate_id>/pricing-tiers/
                      endpoint. The tier must belong to the acting_338 or the pooled plan's 3(38). Requires
                      acting_338 or pooled_plan to also be provided.
                  fund_lineup:
                    type:
                    - string
                    - 'null'
                    description: Opaque ID of the fund lineup to assign to this plan. Retrieve this ID
                      from the Affiliate Firms > Fund Lineups endpoint. The lineup must belong to the
                      same firm as acting_338 or the pooled plan. Requires acting_338 or pooled_plan to
                      also be provided.
                  pooled_plan:
                    type:
                    - string
                    - 'null'
                    description: Opaque ID of the pooled employer plan (PEP) to join as an adopting employer.
                      Retrieve this ID from the Affiliate Firms > Pooled Plans endpoint. You must have
                      permission to access the pooled plan's provider. Mutually exclusive with acting_338.
                      Provide one or the other.
