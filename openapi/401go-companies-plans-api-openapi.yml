                  items:
                    type: object
                    properties:
                      contribution_rate:
                        type: integer
                        maximum: 2147483647
                        minimum: -2147483648
                        description: Match rate as a whole-number percentage (e.g., 100 for 100%, 50 for
                          50%).
                      contribution_max_percent:
                        type: integer
                        maximum: 2147483647
                        minimum: -2147483648
                        description: Maximum percentage of employee compensation this rate applies to.
                          Tiers are cumulative, i.e. each tier covers compensation from the previous tier's
                          max up to this max.
                    required:
                    - contribution_max_percent
                    - contribution_rate
