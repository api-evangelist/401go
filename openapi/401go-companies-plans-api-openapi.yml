                  type: string
                  enum:
                  - Weekly
                  - Bi-Weekly
                  - Semi-Monthly
                  - Monthly
                  description: How often the company runs payroll. If providing this field you must also
                    provide next_payroll_date.
                next_payroll_date:
                  type: string
                  format: date
                  description: Date of the company's next scheduled payroll. Must be in the future and
                    within 365 days. Must be on or after plan_effective_date if provided. If providing
                    this field you must also provide payroll_frequency.
                number_of_employees:
                  type: integer
                  description: Approximate number of current employees. Used to determine SECURE 2.0 automatic
                    enrollment exemptions.
                grandfather_existing_employees:
                  type: boolean
                  description: Whether employees already employed on the plan effective date should be
                    grandfathered in as immediately eligible. Requires plan_effective_date to also be
                    provided.
                employee_notification_date:
                  type: string
                  format: date
                  description: Date on which employees will be notified of the plan. Must be in the future
                    and at least 2 days before plan_effective_date.
                business_start_date:
                  type: string
                  format: date
                  description: Date the company was founded. Used to determine whether the company qualifies
