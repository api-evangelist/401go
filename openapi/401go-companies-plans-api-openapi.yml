                plan_name:
                  type: string
                  minLength: 1
                  description: Name of the 401(k) plan. Follows the same character rules as company_name.
                  maxLength: 100
                plan_type:
                  enum:
                  - Yes - safe harbor match
                  - Yes - nonelective contribution
                  - Yes - QACA safe harbor match
                  - Yes - enhanced safe harbor match
                  - 'No'
                  - Starter-K
                  - Solo-K
                  type: string
                  x-spec-enum-id: 86519a9135c99a99
                  description: 'Type of 401(k) plan. Must always be provided together with plan_effective_date
                    (both or neither). Each plan type enforces specific employer contribution rules. See
                    endpoint description for details.


                    * `Yes - safe harbor match` - Yes - safe harbor match

                    * `Yes - nonelective contribution` - Yes - nonelective contribution

                    * `Yes - QACA safe harbor match` - Yes - QACA safe harbor match

                    * `Yes - enhanced safe harbor match` - Yes - enhanced safe harbor match

                    * `No` - No

                    * `Starter-K` - Starter-K

                    * `Solo-K` - Solo-K'
                automatic_enrollment_percentage:
                  type: string
                  enum:
                  - 0
                  - 3
                  - 4
                  - 5
                  - 6
                  - 7
                  - 8
                  - 9
                  - 10
                  description: Default deferral percentage for automatic enrollment. Use 0 to opt out
                    of automatic enrollment. A value of 0 is only permitted for businesses founded within
                    the past 3 years or with fewer than 11 employees.
                automatic_escalation_cap:
                  type: string
                  enum:
                  - 10
                  - 11
                  - 12
                  - 13
                  - 14
                  - 15
                  description: Maximum percentage to which automatic annual escalation can increase the
                    deferral rate. Requires a non-zero automatic_enrollment_percentage.
                plan_effective_date:
                  type: string
                  format: date
                  description: 'Date the plan becomes effective. Must always be provided together with
                    plan_type (both or neither). Must fall on or after the first of the following month.
                    Exception: during December–February, Traditional, Solo K, and Safe Harbor Non-Elective
                    plans may use December 1st as their effective date.'
                compensation_definition:
                  type: string
                  enum:
                  - W-2
                  - Withholding
                  - Section 415
                  - Section 415 Safe Harbor
                  description: How employee compensation is defined for contribution calculations.
                safe_harbor_exclude_hce_and_key:
                  type: boolean
                  description: Whether to exclude Highly Compensated Employees (HCEs) and key employees
                    from safe harbor contributions. Only applicable to safe harbor plan types.
                service_requirement:
                  type: string
                  enum:
                  - None
                  - 1 Month
                  - 2 Months
                  - 3 Months
                  - 4 Months
                  - 5 Months
                  - 6 Months
                  - 7 Months
                  - 8 Months
                  - 9 Months
                  - 10 Months
                  - 11 Months
                  - 1 Year
                  - Hours of Service
                  - 250 hours worked in 3 months
                  - 500 hours worked in 6 months
                  - 600 hours worked in 1 year
                  - 1,000 hours worked in a year
                  description: Minimum service period an employee must complete before becoming eligible
                    to defer.
                match_service_requirement:
                  type: string
                  enum:
                  - None
                  - 1 Month
                  - 2 Months
                  - 3 Months
                  - 4 Months
                  - 5 Months
                  - 6 Months
                  - 7 Months
                  - 8 Months
                  - 9 Months
                  - 10 Months
                  - 11 Months
                  - 1 Year
                  - Hours of Service
                  - 250 hours worked in 3 months
                  - 500 hours worked in 6 months
                  - 600 hours worked in 1 year
                  - 1,000 hours worked in a year
                  description: Minimum service period an employee must complete before becoming eligible
                    for employer match contributions.
                profit_sharing_service_requirement:
                  type: string
                  enum:
                  - None
                  - 1 Month
                  - 2 Months
                  - 3 Months
                  - 4 Months
                  - 5 Months
                  - 6 Months
                  - 7 Months
                  - 8 Months
                  - 9 Months
                  - 10 Months
                  - 11 Months
                  - 1 Year
                  - Hours of Service
                  - 250 hours worked in 3 months
                  - 500 hours worked in 6 months
                  - 600 hours worked in 1 year
                  - 1,000 hours worked in a year
                  description: Minimum service period an employee must complete before becoming eligible
                    for profit sharing contributions.
                vesting_schedule:
                  type: string
                  enum:
                  - 100% Vested
                  - 2-6 Year Graded
                  - 1-5 Year Graded
                  - 2 Year 50/50
                  - 1-4 Year Graded
                  - 3 Year Cliff
                  - 2 Year Cliff
                  - 1 Year Cliff
                  description: 'Employer match vesting schedule. Requires plan_type to be set. For QACA
                    Safe Harbor plans, must be one of: 100% immediate, 2-year 50/50, or 2-year cliff.'
                profit_sharing_vesting_schedule:
                  type: string
                  enum:
                  - 100% Vested
                  - 2-6 Year Graded
                  - 1-5 Year Graded
                  - 2 Year 50/50
                  - 1-4 Year Graded
                  - 3 Year Cliff
                  - 2 Year Cliff
                  - 1 Year Cliff
                  description: Vesting schedule for profit sharing contributions.
                profit_sharing_requires_employment_on_last_day:
                  type: boolean
                  description: Whether employees must be employed on the last day of the plan year to
                    receive profit sharing contributions.
                deferral_change_frequency:
                  type: string
                  enum:
                  - Each pay period
                  - Monthly
                  - Quarterly
                  description: How frequently employees are permitted to change their deferral percentage.
                deferral_entry_frequency:
                  type: string
                  enum:
                  - Immediate
                  - Monthly
                  - Quarterly
                  - Semi-Annually
                  - Annually
                  description: How frequently new employees become eligible to begin deferring into the
                    plan.
                employer_match_entry_frequency:
                  type: string
                  enum:
                  - Immediate
                  - Monthly
                  - Quarterly
                  - Semi-Annually
                  - Annually
                  description: How frequently new employees become eligible to receive employer match
                    contributions.
                profit_sharing_entry_frequency:
                  type: string
                  enum:
                  - Immediate
                  - Monthly
                  - Quarterly
                  - Semi-Annually
                  - Annually
                  description: How frequently new employees become eligible to receive profit sharing
                    contributions.
                allow_participant_loans:
                  type: boolean
                  description: Whether participants are permitted to take loans from their plan accounts.
                deferral_minimum_age:
                  type: integer
                  description: Minimum age (18–21 inclusive) an employee must reach before becoming eligible
                    to defer.
                employer_match_minimum_age:
                  type: integer
                  description: Minimum age (18–21 inclusive) an employee must reach before becoming eligible
                    for employer match.
                profit_sharing_minimum_age:
                  type: integer
                  description: Minimum age (18–21 inclusive) an employee must reach before becoming eligible
                    for profit sharing.
                employer_match_tiers:
                  type: array
                  items:
                    type: object
                    properties:
                      contribution_rate:
                        type: integer
                        maximum: 2147483647
                        minimum: -2147483648
                        description: Match rate as a whole-number percentage (e.g., 100 for 100%, 50 for
                          50%).
                      contribution_max_percent:
                        type: integer
                        maximum: 2147483647
                        minimum: -2147483648
                        description: Maximum percentage of employee compensation this rate applies to.
                          Tiers are cumulative, i.e. each tier covers compensation from the previous tier's
                          max up to this max.
                    required:
                    - contribution_max_percent
                    - contribution_rate
                  description: Employer match formula expressed as one or more tiers. Cannot be provided
                    together with non_elective_contribution. Each tier specifies contribution_rate (integer
                    match percentage) and contribution_max_percent (maximum percentage of compensation
                    this rate applies to). Required format varies by plan type. See endpoint description
                    for per-plan-type rules.
                non_elective_contribution:
                  type: integer
                  description: Employer non-elective (guaranteed) contribution as a percentage of each
                    eligible employee's compensation. Cannot be provided together with employer_match_tiers.
                    For Safe Harbor Non-Elective plans, must be between 3 and 6 (inclusive).
                payroll_frequency:
                  type: string
                  enum:
                  - Weekly
                  - Bi-Weekly
                  - Semi-Monthly
                  - Monthly
                  description: How often the company runs payroll. If providing this field you must also
                    provide next_payroll_date.
                next_payroll_date:
                  type: string
                  format: date
                  description: Date of the company's next scheduled payroll. Must be in the future and
                    within 365 days. Must be on or after plan_effective_date if provided. If providing
                    this field you must also provide payroll_frequency.
                number_of_employees:
                  type: integer
                  description: Approximate number of current employees. Used to determine SECURE 2.0 automatic
                    enrollment exemptions.
                grandfather_existing_employees:
                  type: boolean
                  description: Whether employees already employed on the plan effective date should be
                    grandfathered in as immediately eligible. Requires plan_effective_date to also be
                    provided.
                employee_notification_date:
                  type: string
                  format: date
                  description: Date on which employees will be notified of the plan. Must be in the future
                    and at least 2 days before plan_effective_date.
                business_start_date:
                  type: string
                  format: date
                  description: Date the company was founded. Used to determine whether the company qualifies
                    for SECURE 2.0 automatic enrollment exemptions (businesses founded within the past
                    3 years).
                acting_338:
                  type:
                  - string
                  - 'null'
                  description: ID of the 3(38) investment advisor to associate with this plan. Retrieve
                    this ID from the  affiliate-firms/<affiliate_firm_id>/affiliates/ endpoint. An affiliate
                    firm ID may also be provided to assign that affiliate firm as the 3(38). Mutually
                    exclusive with pooled_plan. Provide one or the other.
                billing_tier:
                  type:
                  - string
                  - 'null'
                  description: ID of the pricing tier to apply to this plan. Retrieve this ID from the
                    affiliate-firms/<affiliate_firm_id>/pricing-tiers/ or affiliates/<affiliate_id>/pricing-tiers/
                    endpoint. The tier must belong to the acting_338 or the pooled plan's 3(38). Requires
                    acting_338 or pooled_plan to also be provided.
                fund_lineup:
                  type:
                  - string
                  - 'null'
                  description: Opaque ID of the fund lineup to assign to this plan. Retrieve this ID from
                    the Affiliate Firms > Fund Lineups endpoint. The lineup must belong to the same firm
                    as acting_338 or the pooled plan. Requires acting_338 or pooled_plan to also be provided.
                pooled_plan:
                  type:
                  - string
                  - 'null'
                  description: Opaque ID of the pooled employer plan (PEP) to join as an adopting employer.
                    Retrieve this ID from the Affiliate Firms > Pooled Plans endpoint. You must have permission
                    to access the pooled plan's provider. Mutually exclusive with acting_338. Provide
                    one or the other.
