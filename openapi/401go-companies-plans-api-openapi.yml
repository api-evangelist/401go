                  type:
                  - string
                  - 'null'
                  description: Opaque ID of the pooled employer plan (PEP) to join as an adopting employer.
                    Retrieve this ID from the Affiliate Firms > Pooled Plans endpoint. You must have permission
                    to access the pooled plan's provider. Mutually exclusive with acting_338. Provide
                    one or the other.
