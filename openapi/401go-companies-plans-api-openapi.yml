  /plan-setup/{company_id}/:
    put:
      operationId: plan_setup_update
      description: 'Updates an existing 401(k) plan.


        The ``{id}`` path parameter is the ``object_id`` returned from the POST response.


        Partial updates (PATCH) will not work. Endpoint currently only supports full replacement (PUT).


        Updates are blocked if the plan has been modified through the web portal after initial

        API setup, or if the plan is or was active.'
