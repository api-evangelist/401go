  /participants/{participant_id}/matches/:
    get:
      operationId: participants_matches_retrieve
      parameters:
      - in: path
        name: participant_id
        schema:
          type: string
        required: true
      tags:
      - Contributions & Payroll
      security:
      - oauth2: []
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan_matches:
                    type: array
                    items:
                      type: object
                      properties:
                        contribution_rate:
                          type: integer
                          maximum: 2147483647
                          minimum: -2147483648
                          description: Match rate as a whole-number percentage (e.g., 100 for 100%, 50
                            for 50%).
                        contribution_max_percent:
                          type: integer
                          maximum: 2147483647
                          minimum: -2147483648
                          description: Maximum percentage of employee compensation this rate applies to.
                            Tiers are cumulative, i.e. each tier covers compensation from the previous
                            tier's max up to this max.
                      required:
                      - contribution_max_percent
                      - contribution_rate
                  discretionary_matches:
                    type: array
                    items:
                      type: object
                      properties:
                        contribution_rate:
                          type: integer
                          maximum: 2147483647
                          minimum: -2147483648
                          description: Match rate as a whole-number percentage (e.g., 100 for 100%, 50
                            for 50%).
                        contribution_max_percent:
                          type: integer
                          maximum: 2147483647
                          minimum: -2147483648
                          description: Maximum percentage of employee compensation this rate applies to.
                            Tiers are cumulative, i.e. each tier covers compensation from the previous
                            tier's max up to this max.
                      required:
                      - contribution_max_percent
                      - contribution_rate
                  discretionary_nonelective:
                    allOf:
                    - type: object
                      properties:
                        contribution_rate:
                          type: integer
                      required:
                      - contribution_rate
                  nondiscretionary_nonelective:
                    allOf:
                    - type: object
                      properties:
                        contribution_rate:
                          type: integer
                      required:
                      - contribution_rate
                required:
                - discretionary_matches
                - discretionary_nonelective
                - nondiscretionary_nonelective
                - plan_matches
          description: ''
        '401':
          description: 'Unauthorized: Missing or invalid authentication'
        '403':
          description: 'Forbidden: Insufficient permissions or scopes'
  /participants/{participant_id}/payroll-lines/:
    get:
      operationId: participants_payroll_lines_list
      description: Get the payroll lines for a participant.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: participant_id
        schema:
          type: string
        required: true
      tags:
      - Contributions & Payroll
      security:
      - oauth2: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - count
                - results
                properties:
                  count:
                    type: integer
                    example: 123
                  next:
                    type:
                    - string
                    - 'null'
                    format: uri
                    example: http://api.example.org/accounts/?page=4
                  previous:
                    type:
                    - string
                    - 'null'
                    format: uri
                    example: http://api.example.org/accounts/?page=2
                  results:
                    type: array
                    items:
                      type: object
                      description: 'A payroll line represents payroll for one participant and has the
                        associated id of that participant.


                        It can also optionally include hours_ytd and gross_pay_ytd which will help in
                        reporting, eligibility, etc. when provided.'
                      properties:
                        participant_id:
                          type: string
                        hours:
                          type: string
                          format: decimal
                          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
                        gross_pay:
                          type: string
                          format: decimal
                          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
                        pre_tax_percent:
                          type: string
                          format: decimal
                          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
                          readOnly: true
                          description: Enter a percentage, so 1% would be 1.0 and 5 bps would be 0.05
                        pre_tax_amount:
                          type: string
                          format: decimal
                          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
                        post_tax_percent:
                          type: string
                          format: decimal
                          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
                          readOnly: true
                          description: Enter a percentage, so 1% would be 1.0 and 5 bps would be 0.05
                        post_tax_amount:
                          type: string
                          format: decimal
                          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
                        company_contribution:
                          type: string
                          format: decimal
                          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
                        other_additions:
                          type: array
                          items:
                            type: object
                            description: 'Additional payroll deductions not covered by employee contributions
