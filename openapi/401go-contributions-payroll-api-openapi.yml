                    is_percent:
                      type: boolean
                  required:
                  - amount
                  - timestamp
      security:
      - oauth2: []
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  traditional:
                    type: object
                    properties:
                      amount:
                        type: string
                        format: decimal
                        pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
                      timestamp:
                        type: string
                        format: date-time
                        description: Timestamp for conflict resolution. If older than the last deferral
