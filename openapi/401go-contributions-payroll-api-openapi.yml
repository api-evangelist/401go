                      pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
                    timestamp:
                      type: string
                      format: date-time
                      description: Timestamp for conflict resolution. If older than the last deferral
                        update in our system, an error will be returned and deferrals will not be updated.
                    is_percent:
                      type: boolean
                  required:
                  - amount
