                              Currently, this can only be set to Loan types.'
                            properties:
                              additional_amount:
                                type: string
                                format: decimal
                                pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
                              other_type:
                                enum:
                                - Loan Principal
                                - Loan Interest
                                type: string
                                description: '* `Loan Principal` - Loan Principal

                                  * `Loan Interest` - Loan Interest'
                                x-spec-enum-id: a05082d953d3615e
                            required:
                            - additional_amount
                            - other_type
                        check_date:
                          type: string
                          format: date
                          readOnly: true
                      required:
                      - check_date
                      - gross_pay
                      - hours
                      - participant_id
                      - post_tax_percent
                      - pre_tax_percent
          description: ''
        '401':
          description: 'Unauthorized: Missing or invalid authentication'
        '403':
          description: 'Forbidden: Insufficient permissions or scopes'
  /participants/{participant_id}/totals/:
    get:
      operationId: participants_totals_retrieve
      description: "Returns year-to-date contribution totals, account balances, income, loans,\nand applicable\
        \ annual contribution limits.\n\nIncludes YTD totals for:\n- Pre-tax contributions\n- Post-tax\
        \ contributions\n- Company contributions\n- Compensation (YTD and prior year)\n\nAlso includes:\n\
        - Total account balance\n- Cash balance\n- Active loan balances\n- Payroll count for the year\n\
        \nContribution limits:\n\n- Pre-tax and post-tax contributions share a single combined\n  contribution\
        \ limit.\n  This means contributions to EITHER pre-tax OR post-tax reduce\n  the remaining limit\
        \ for BOTH.\n\n  Example:\n  If the contribution limit is $23,000 and a participant contributes\n\
        \  $10,000 pre-tax, they can contribute at most $13,000 more total\n  across pre-tax and post-tax\
        \ combined.\n\n- Catch-up contributions have special eligibility rules.\n  A participant may be\
        \ eligible for Roth (post-tax) catch-up\n  without being eligible for traditional (pre-tax) catch-up.\n\
        \n- The `year_contribution_limit` is the absolute maximum for all\n  contributions combined:\n\
        \  pre-tax + post-tax + all catch-up contributions.\n\n- Each contribution type may not exceed\
        \ its own individual limit."
      parameters:
      - in: path
        name: participant_id
        schema:
          type: string
        required: true
      tags:
      - Contributions & Payroll
      security:
      - oauth2: []
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  pretax_ytd:
                    type: number
                    format: double
                    minimum: 0.0
                    exclusiveMaximum: 10000000000
                  posttax_ytd:
                    type: number
                    format: double
                    minimum: 0.0
                    exclusiveMaximum: 10000000000
                  company_contributions_ytd:
                    type: number
                    format: double
                    minimum: 0.0
                    exclusiveMaximum: 10000000000
                  annual_income:
                    type: number
                    format: double
                    minimum: 0.0
                    description: Expected total annual income based on prior years.
                    exclusiveMaximum: 10000000000
                  annual_income_ytd:
                    type: number
                    format: double
                    minimum: 0.0
                    description: Annual income earned year-to-date.
                    exclusiveMaximum: 10000000000
                  total_balance:
                    type: number
                    format: double
                    minimum: 0.0
                    description: Total account balance, including all investments and cash.
                    exclusiveMaximum: 10000000000
                  cash_balance:
                    type: number
                    format: double
                    minimum: 0.0
                    description: Cash balance in the account.
                    exclusiveMaximum: 10000000000
                  year_payroll_count:
                    type: integer
                    minimum: 0.0
                    description: Number of expected payrolls in a year.
                  loans:
                    type: array
                    items:
                      type: object
                      properties:
                        loan_balance:
                          type: number
                          format: double
                          readOnly: true
                        issue_date:
                          type: string
                          format: date
                        first_payment_date:
                          type:
                          - string
                          - 'null'
                          format: date
                        years_duration:
                          type: integer
                          readOnly: true
                      required:
                      - first_payment_date
                      - issue_date
                      - loan_balance
                      - years_duration
                  year_contribution_limit:
                    type: number
                    format: double
                    minimum: 0.0
                    description: Participant contribution limits for the year.
                    exclusiveMaximum: 10000000000
                  pre_tax_contribution_limit:
                    type: number
                    format: double
                    minimum: 0.0
                    description: Pre-tax contribution limits for the year.
                    exclusiveMaximum: 10000000000
                  post_tax_contribution_limit:
                    type: number
                    format: double
                    minimum: 0.0
                    description: Post-tax contribution limits for the year.
                    exclusiveMaximum: 10000000000
                  pre_tax_catch_up_contribution_limit:
                    type: number
                    format: double
                    minimum: 0.0
                    description: Pre-tax catch-up contribution limits for the year.
                    exclusiveMaximum: 10000000000
                  post_tax_catch_up_contribution_limit:
                    type: number
                    format: double
                    minimum: 0.0
                    description: Post-tax catch-up contribution limits for the year.
                    exclusiveMaximum: 10000000000
                required:
                - annual_income
                - annual_income_ytd
                - cash_balance
                - company_contributions_ytd
                - loans
                - posttax_ytd
                - pretax_ytd
                - total_balance
                - year_payroll_count
          description: ''
        '401':
          description: 'Unauthorized: Missing or invalid authentication'
        '403':
          description: 'Forbidden: Insufficient permissions or scopes'
