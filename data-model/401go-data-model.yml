identifiers:
  primary_key_field: object_id
  form: opaque string, no type prefix
  note: >-
    401GO uses a single untyped object_id field on every resource rather than prefixed ids.
    Participant identifiers are documented as "encrypted participant identifier". Because ids
    are untyped, an id alone does not reveal its entity — the entity is implied by the path.
  path_parameters: [affiliate_firm_id, affiliate_id, company_id, participant_id, investment_id,
    beneficiary_id, loan_request_id, disbursement_id, rollover_id, notification_id, attachment_id,
    document_name]

derivation_note: >-
  The published spec inlines every schema rather than using $ref between component schemas, so
  the entity graph is derived from the URI hierarchy (which encodes containment directly) plus
  the documented id-handoff rules on the plan-setup operation, not from $ref edges.

