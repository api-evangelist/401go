generated: '2026-08-02'
method: searched
source: https://developer.401go.com/docs/versioning
api: 401GO API

versioning:
  scheme: header-date
  header: api-version
  format: ISO date string (YYYY-MM-DD)
  granularity: per-endpoint
  current: null
  current_note: >-
    401GO publishes no version list or "current version" marker. Versions are addressed by
    date, and the effective default is the version current on the date the calling application
    was registered. The OpenAPI info.version is 1.0.0 but is not the addressable API version.
  default_behavior: >-
    Omitting the header pins the client to the version that was current when its application
    was registered, so existing integrations retain backwards compatibility indefinitely.
  resolution: >-
    If the supplied date falls between two published versions, the API serves the latest
    version older than or equal to the supplied date.
  guidance: 401GO recommends always building to the latest version of each endpoint.
  docs: https://developer.401go.com/docs/versioning

deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  note: >-
    No deprecation or sunset policy is published, and no RFC 8594 Sunset/Deprecation header
    support is documented. The date-pinned versioning scheme is the de facto compatibility
    guarantee — old endpoint versions are retained rather than deprecated — but no retirement
    window, notice period, or sunset signal is stated anywhere in the developer docs.

deprecated_operations: []
deprecated_operations_note: >-
