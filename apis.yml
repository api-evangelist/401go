apis:
- aid: 401go:401go-api
  name: 401GO API
  description: The 401GO partner REST API. 72 operations across 50 paths covering affiliate
    firms and advisors, companies and 401(k) plan setup, plan provisions and employer match
    formulas, participant census, payroll submission, deferrals, investments and portfolios,
    beneficiaries, disbursements, loan requests, rollovers, money-movement history,
    retirement-planning estimates, notifications and participant documents. OAuth 2.0 bearer
    or Knox token auth, page/page_size pagination, and header-based per-endpoint date
    versioning via the api-version header.
