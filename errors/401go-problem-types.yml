domain_validation_rules:
  note: >-
    The plan-setup operations publish an unusually rich set of cross-field validation rules
    whose violations surface as 400 field-scoped errors. Captured here because they are the
    dominant source of 4xx on the plan setup flow.
  source: https://developer.401go.com/reference/plan_setup_create
  rules:
  - Mutually exclusive - pooled_plan and acting_338; provide at most one.
  - Mutually exclusive - employer_match_tiers and non_elective_contribution; provide at most one.
  - Provide both or neither - plan_type and plan_effective_date.
  - Provide both or neither - payroll_frequency and next_payroll_date.
  - grandfather_existing_employees requires plan_effective_date.
  - billing_tier and fund_lineup each require acting_338 or pooled_plan.
  - automatic_escalation_cap requires a non-zero automatic_enrollment_percentage.
  - safe_harbor_exclude_hce_and_key is only valid for safe harbor plan types.
  - vesting_schedule requires plan_type.
  - Basic Safe Harbor match must follow the standard formula exactly - 100% of the first 3%, then 50% of the next 2%.
  - Enhanced Safe Harbor - one match tier; total match a whole number between 4% and 6%.
  - Safe Harbor Non-Elective - use non_elective_contribution (3-6%); do not provide employer_match_tiers.
  - QACA Safe Harbor - total match between 3.5% and 6%.
  - Traditional / Starter K / Solo K - one match tier; total match a whole number between 0% and 10%.
  - EIN must be new to the platform; an existing EIN is rejected. Takeover plans are not supported via API.
  - PUT only on plan-setup update; PATCH partial updates are not supported.
  - Plan updates are blocked if the plan was modified in the web portal after API setup, or if the plan is or was active.

