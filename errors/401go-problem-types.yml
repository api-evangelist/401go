envelope:
  description: >-
    401GO uses one predictable error shape across every error type. A single error is an object
    with a user-safe message and a nullable developer-only detail.
  shape:
    user_error_message: string — safe to show to end users
    developer_error_detail: string|null — extra context for developers only
  field_scoped_errors: >-
    Errors caused by submitted data are keyed by field name and nest to mirror the submitted
    JSON structure, each leaf carrying the same two-field pair. A response may mix a top-level
    error with field-scoped errors.
  example_single: |
    {
        "developer_error_detail": "The requested item does not match the expected type for this endpoint.",
        "user_error_message": "Invalid operation, please reach out to support."
    }
  example_field_scoped: |
    {
        "loan_duration": {
            "developer_error_detail": "cannot be more than 5 years if is_primary_residence is False",
            "user_error_message": "Cannot be for more than 5 years"
        },
        "address": {
            "city": {
                "developer_error_detail": null,
                "user_error_message": "This field is required."
            }
        }
    }

